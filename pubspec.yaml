name: cinematch
description: "Cine Match"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gerenciamento de estado reativo (RNF04)
  provider: ^6.1.2

  # Consumo da API REST do TMDB (RF01, RF02, RF07, RF08)
  http: ^1.2.2

  # Persistência local — mesmo padrão (sqflite + DatabaseHelper singleton)
  # do projeto de referência "CRUD de Games". `sqflite_common_ffi_web` dá
  # à mesma classe DatabaseHelper suporte também à Web (IndexedDB por trás
  # dos panos), sem precisar de uma implementação de banco separada.
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48